name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
          --cpus 2

    env:
      LEDGER_TEST_DATABASE_URL: postgresql+asyncpg://ledger:ledger@localhost:5432/ledger_test
      LEDGER_DATABASE_URL: postgresql+asyncpg://ledger:ledger@localhost:5432/ledger_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests migrations loadtest scripts

      - name: Migrations aplicam e revertem
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Testes (row_lock)
        # cov-fail-under evita o badge apodrecer em silencio: se a cobertura cair
        # abaixo do piso, o CI quebra antes de publicar um numero bonito.
        run: pytest -q --cov=ledger --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Testes de concorrencia (serializable)
        env:
          LEDGER_LOCK_STRATEGY: serializable
        run: pytest tests/test_concurrency.py -q

      - name: Publicar badge de cobertura
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/coverage_badge.py coverage.xml coverage.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges-tmp
          git rm -rf --cached . > /dev/null
          git add -f coverage.svg
          git commit -m "coverage badge: $(python -c "import sys;sys.path.insert(0,'scripts');from coverage_badge import coverage_percent;print(coverage_percent('coverage.xml'))")%"
          git push -f origin badges-tmp:badges

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ledger-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
