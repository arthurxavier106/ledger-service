name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
          --cpus 2

    env:
      LEDGER_TEST_DATABASE_URL: postgresql+asyncpg://ledger:ledger@localhost:5432/ledger_test
      LEDGER_DATABASE_URL: postgresql+asyncpg://ledger:ledger@localhost:5432/ledger_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests migrations loadtest

      - name: Migrations aplicam e revertem
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Testes (row_lock)
        run: pytest -q --cov=ledger --cov-report=xml --cov-report=term

      - name: Testes de concorrencia (serializable)
        env:
          LEDGER_LOCK_STRATEGY: serializable
        run: pytest tests/test_concurrency.py -q

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ledger-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
